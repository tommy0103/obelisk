name: Nix packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nix.yml'
      - 'flake.*'
      - 'nix/**'
      - 'app/**'
      - 'packages/**'
      - 'packaging/**'
      - 'skill-doc/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'tests/fixtures/claude/custom-title-session.jsonl'

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - run: nix flake check --no-update-lock-file --print-build-logs
